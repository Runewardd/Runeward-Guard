[package]
name = "runeward-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
url = "2"
ctrlc = "3"

[[bin]]
name = "guard"
path = "src/bin/guard.rs"

[[bin]]
name = "guard-browser-host"
path = "src/bin/guard-browser-host.rs"
