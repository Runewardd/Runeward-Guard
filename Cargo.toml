[package]
name = "runeward-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
ctrlc = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
endpoint-sec = { version = "0.6.2", default-features = false, features = ["macos_11_0_0"] }

[[bin]]
name = "guard"
path = "src/bin/guard.rs"

[[bin]]
name = "guard-browser-host"
path = "src/bin/guard-browser-host.rs"

[[bin]]
name = "guard-sensor"
path = "src/bin/guard-sensor.rs"
